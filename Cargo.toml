[package]
name = "africhain"
version = "0.51.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
actix-web = "4"
rand = "0.8"

[[bin]]
name = "afri-ed25519-test"
path = "afri_ed25519_test.rs"
