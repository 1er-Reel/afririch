[package]
name = "africhain"
version = "0.33.1"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
actix-web = "4"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
