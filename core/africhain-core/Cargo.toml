[package]
name = "africhain-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "africhain_core"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "afri-cli"
path = "src/main.rs"
